name: CI Pipeline

on:
  push:
  # Branches</inline> to monitor for changes
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Clone the repository into the runner
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Set up the programming environment (Node.js example)
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    # Step 3: Install project dependencies
    - name: Install dependencies
      run: npm ci

    # Step 4: Run automated tests
    - name: Run tests
      run: npm test
      run: npm run test:coverage