# Trigger the pipeline whenever a change is pushed to the main branch
trigger:
- main

# Specify the virtual machine image to run your build jobs on
pool:
  vmImage: 'ubuntu-latest'

# Define global variables used across the pipeline steps
variables:
  buildConfiguration: 'Release'

stages:
- stage: Build
  displayName: 'Build and Test Stage'
  jobs:
  - job: BuildJob
    displayName: 'Compile, Test, and Package App'
    steps:
    
    # Step 1: Install runtime/SDK dependencies (Example: Node.js)
    # Hint: Replace this with the SDK appropriate for your stack (e.g., UseDotNet@2 for .NET)
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Install Node.js'

    # Step 2: Restore packages and run the application build
    - script: |
        npm install
        npm run build -- --configuration=$(buildConfiguration)
      displayName: 'npm install and build'

    # Step 3: Execute Unit Tests
    - script: |
        npm test
      displayName: 'Run Unit Tests'

    # Step 4: Archive files into a deployable package (e.g., zip format)
    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)/dist'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/drop.zip'
        replaceExistingArchive: true
      displayName: 'Archive Build Artifacts'

    # Step 5: Publish the package so it can be consumed later by a CD pipeline
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/drop.zip'
        ArtifactName: 'drop'
        publishLocation: 'Container'
      displayName: 'Publish Build Artifacts'
